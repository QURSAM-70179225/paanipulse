<!doctype html>
<html lang="ur">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#047857" />
<title>PaaniPulse · Offline</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #0f172a;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; padding: 16px; }
  .card { max-width: 380px; background: #fff; border: 1px solid #e2e8f0; border-radius: 20px; padding: 24px; text-align: center; }
  img { width: 72px; height: 72px; }
  h1 { font-size: 22px; margin: 12px 0 4px; }
  .ur { direction: rtl; font-size: 20px; line-height: 1.9; margin: 8px 0; }
  p { color: #475569; }
  button { margin-top: 12px; height: 48px; padding: 0 20px; border: 0; border-radius: 12px; background: #047857; color: #fff; font-size: 16px; font-weight: 600; }
</style>
</head>
<body>
  <main class="card">
    <img src="/icon-192.png" alt="" />
    <h1>You are offline</h1>
    <p class="ur">انٹرنیٹ نہیں ہے۔ سگنل آنے پر دوبارہ کوشش کریں۔</p>
    <p>PaaniPulse needs internet to get today's weather and advice. Try again when you have signal.</p>
    <button onclick="location.reload()">دوبارہ کوشش کریں · Try again</button>
  </main>
</body>
</html>
