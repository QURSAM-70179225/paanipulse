<!doctype html>
<html lang="ur">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#047857" />
<title>PaaniPulse · Offline</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #f8fafc; color: #0f172a; padding: 16px;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; display: grid; place-items: start center; }
  main { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 12px; }
  .banner { background: #fef3c7; color: #78350f; border-radius: 14px; padding: 10px 14px; font-weight: 600; font-size: 14px; }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 20px; padding: 18px; }
  .head { display: flex; gap: 12px; align-items: center; }
  .head img { width: 48px; height: 48px; border-radius: 12px; }
  h1 { font-size: 20px; margin: 0; } h2 { font-size: 15px; margin: 0 0 6px; color: #475569; font-weight: 600; }
  .big { font-size: 28px; font-weight: 800; line-height: 1.5; margin: 6px 0; }
  .ur { direction: rtl; font-size: 22px; line-height: 2.1; font-family: "Noto Nastaliq Urdu", "Jameel Noori Nastaleeq", "Urdu Typesetting", serif; }
  .meta { color: #475569; font-size: 14px; }
  .tabs { display: flex; gap: 6px; margin: 10px 0; }
  .tabs button { flex: 1; height: 44px; border-radius: 12px; border: 2px solid #e2e8f0; background: #fff; font-size: 15px; font-weight: 600; }
  .tabs button[aria-pressed="true"] { border-color: #059669; background: #ecfdf5; color: #064e3b; }
  .btn { width: 100%; height: 52px; border: 0; border-radius: 14px; background: #047857; color: #fff; font-size: 17px; font-weight: 700; margin-top: 8px; }
  .btn.alt { background: #fff; color: #0f172a; border: 1px solid #cbd5e1; }
  .stat { display: inline-block; background: #f1f5f9; border-radius: 10px; padding: 6px 10px; margin: 2px 4px 2px 0; font-size: 14px; }
  .warn { background: #fee2e2; color: #7f1d1d; border-radius: 14px; padding: 10px 14px; font-size: 14px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="banner" id="banner"><span class="ur" style="font-size:16px;line-height:1.8">انٹرنیٹ نہیں ہے</span> · No internet</div>

  <section class="card" id="saved" hidden>
    <div class="head"><img src="/icon-192.png" alt="" /><div><h1 id="who">PaaniPulse</h1><p class="meta" id="when"></p></div></div>
    <div class="tabs" role="group" aria-label="Language">
      <button type="button" data-l="ur" aria-pressed="true">اردو</button>
      <button type="button" data-l="roman" aria-pressed="false">Roman</button>
      <button type="button" data-l="en" aria-pressed="false">English</button>
    </div>
    <p class="big" id="advice"></p>
    <p id="stats"></p>
    <button class="btn" id="speak" type="button">▶ <span id="speakLabel">آواز سنیں · Play voice</span></button>
    <p class="meta" id="speakNote" hidden></p>
  </section>

  <section class="card" id="none" hidden>
    <div class="head"><img src="/icon-192.png" alt="" /><div><h1>PaaniPulse</h1></div></div>
    <p class="ur">ابھی کوئی محفوظ مشورہ نہیں۔ ایک بار انٹرنیٹ پر ایپ کھولیں، پھر آخری مشورہ بغیر انٹرنیٹ بھی نظر آئے گا۔</p>
    <p class="meta">No saved advice yet. Open the app once with internet and the latest advice will show here when you are offline.</p>
  </section>

  <div class="warn" id="queued" hidden></div>
  <button class="btn alt" type="button" onclick="location.reload()">دوبارہ کوشش کریں · Try again</button>
</main>
<script>
(function () {
  // Keys must match lib/offline.ts
  var SNAP = "pp_snapshot_v1", QUEUE = "pp_queue_v1";
  function read(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  var snap = read(SNAP), queue = read(QUEUE) || [];
  var lang = snap && snap.lang === "en" ? "en" : "ur";
  var el = function (id) { return document.getElementById(id); };

  function when(iso) {
    var d = new Date(iso), now = new Date();
    var opts = { hour: "2-digit", minute: "2-digit", timeZone: "Asia/Karachi" };
    var t = d.toLocaleTimeString("en-GB", opts);
    var day = new Date(d.toLocaleString("en-US", { timeZone: "Asia/Karachi" })).toDateString();
    var today = new Date(now.toLocaleString("en-US", { timeZone: "Asia/Karachi" })).toDateString();
    return (day === today ? "Aaj / Today " : d.toLocaleDateString("en-GB", { day: "numeric", month: "short", timeZone: "Asia/Karachi" }) + " ") + t;
  }

  function render() {
    var texts = snap.texts || {};
    var text = texts[lang] || texts.en || "";
    var a = el("advice");
    a.textContent = text;
    a.className = "big" + (lang === "ur" ? " ur" : "");
    a.style.fontSize = text.length > 120 ? "18px" : "22px";
    [].forEach.call(document.querySelectorAll(".tabs button"), function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-l") === lang)); });
    el("stats").textContent = "";
    function stat(t) { var s = document.createElement("span"); s.className = "stat"; s.textContent = t; el("stats").appendChild(s); }
    if (snap.tempC != null) stat(Math.round(snap.tempC) + "°C");
    if (snap.tMax != null && snap.tMin != null) stat(Math.round(snap.tMax) + "° / " + Math.round(snap.tMin) + "°");
    if (snap.rainTomorrowMm >= 2) stat("Kal barish / Rain tomorrow: " + snap.rainTomorrowMm.toFixed(0) + " mm");
  }

  if (snap && snap.texts) {
    el("saved").hidden = false;
    el("who").textContent = snap.name || "PaaniPulse";
    el("when").textContent = "Saved " + when(snap.savedAt) + " · محفوظ شدہ";
    render();
    [].forEach.call(document.querySelectorAll(".tabs button"), function (b) {
      b.addEventListener("click", function () { lang = b.getAttribute("data-l"); render(); });
    });
    el("speak").addEventListener("click", function () {
      var synth = window.speechSynthesis;
      var note = el("speakNote");
      if (!synth) { note.hidden = false; note.textContent = "Voice not available on this phone. Please read the message."; return; }
      synth.cancel();
      var voices = synth.getVoices();
      var ur = voices.find(function (v) { return v.lang && v.lang.toLowerCase().indexOf("ur") === 0; });
      var fallback = voices.find(function (v) { return v.lang === "en-IN"; }) || voices.find(function (v) { return v.lang && v.lang.indexOf("en") === 0; });
      var text = (snap.texts[lang === "ur" && !ur ? "roman" : lang]) || "";
      var u = new SpeechSynthesisUtterance(text);
      var v = lang === "ur" ? (ur || fallback) : fallback;
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.9;
      note.hidden = true;
      synth.speak(u);
    });
  } else {
    el("none").hidden = false;
  }

  if (queue.length) {
    var q = el("queued"); q.hidden = false;
    q.textContent = queue.length + " report(s) saved on this phone, will be sent when you have internet. · " + queue.length + " رپورٹ فون میں محفوظ";
  }

  // Come back automatically when the connection returns.
  window.addEventListener("online", function () { location.reload(); });
})();
</script>
</body>
</html>
